# Installed by scripts/vm/setup.sh as /etc/nginx/sites-available/ml-app.
# certbot --nginx later adds the 443 server block + HTTP->HTTPS redirect to this file.

limit_req_zone $binary_remote_addr zone=ml_predict:10m rate=10r/s;

# Only the Vercel proxy (frontend/api/[endpoint].js) knows PROXY_KEY and sends it as
# X-Proxy-Key; setup.sh fills in both placeholders. Without PROXY_KEY the gate is off.
# A regex, not an exact key: a 64-char exact key overflows the default
# map_hash_bucket_size and fails `nginx -t`. setup.sh limits the key to [A-Za-z0-9_-].
map $http_x_proxy_key $proxy_key_ok {
    default __PROXY_KEY_DEFAULT__;
    "~^__PROXY_KEY__$" 1;
}

upstream ml_cnn { server 127.0.0.1:8001; keepalive 8; }
upstream ml_rnn { server 127.0.0.1:8002; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # base64 images; the API itself caps image_base64 at ~6MB.
    client_max_body_size 8m;
    # For nginx's own `return` bodies; proxied responses keep the app's Content-Type.
    default_type application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Same id in nginx's access log and the app's JSON logs.
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;

    location = / {
        default_type application/json;
        return 200 '{"services": ["/cnn/", "/rnn/"], "endpoints": ["health", "version", "predict", "docs"]}';
    }

    # Trailing slash on proxy_pass strips the /cnn prefix; the app knows it via ROOT_PATH.
    location /cnn/ {
        if ($proxy_key_ok = 0) { return 403 '{"detail": "use the web app"}'; }
        limit_req zone=ml_predict burst=20 nodelay;
        proxy_pass http://ml_cnn/;
    }

    location /rnn/ {
        if ($proxy_key_ok = 0) { return 403 '{"detail": "use the web app"}'; }
        limit_req zone=ml_predict burst=20 nodelay;
        proxy_pass http://ml_rnn/;
    }
}
